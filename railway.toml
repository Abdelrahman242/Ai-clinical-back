FROM python:3.11-slim

WORKDIR /app

# Install build deps if needed, then install requirements
COPY requirements.txt ./
RUN pip install --no-cache-dir -r requirements.txt

# Copy app
COPY . .

# Use PORT provided by Railway when running container (set CMD to use $PORT via entrypoint shell)
CMD ["sh", "-lc", "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"]
